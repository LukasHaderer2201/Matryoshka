<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Attack Big Picture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');

  :root {
    --bg: #020b16;
    --accent: #00c8ff;
    --accent2: #ff3c6e;
    --gold: #c58312;
    --glow: 0 0 20px rgba(0,200,255,0.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    font-family: 'Exo 2', sans-serif;
    color: #c8e8ff;
    overflow: hidden;
    height: 100vh; width: 100vw;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events:none; z-index:9999;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events:none; z-index:0;
  }
  #canvas-wrapper { position:fixed; inset:0; z-index:1; }
  canvas { display:block; touch-action:none; }

  /* Großbild-Skalierung: --ui wird im Script aus der Viewport-Größe berechnet
     (Full HD = 1, 4K UHD = 2), damit die Bedienelemente auf dem
     86"-4K-Display (iiyama ProLite TE8603MIS) nicht winzig bleiben. */
  #header, #teams, #counter, #detail-panel, #hint { zoom: var(--ui, 1); }

  #header {
    position:fixed; top:0; left:0; right:0; z-index:100;
    padding: 18px 32px;
    display:flex; align-items:center; gap:14px;
    background: linear-gradient(180deg, rgba(0,8,20,0.97) 0%, transparent 100%);
  }
  .logo-icon {
    width:44px; height:44px;
    border: 2px solid var(--accent); border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    animation: pulse-border 2s ease-in-out infinite;
  }
  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 10px rgba(0,200,255,0.4); }
    50%      { box-shadow: 0 0 30px rgba(0,200,255,0.9); }
  }
  h1 {
    font-family:'Orbitron', monospace; font-size:clamp(13px,2vw,22px); font-weight:900;
    letter-spacing:4px; text-transform:uppercase; color: var(--accent);
    text-shadow: 0 0 20px rgba(0,200,255,0.7);
  }
  .subtitle { font-family:'Share Tech Mono', monospace; font-size:10px; color: rgba(0,200,255,0.5); letter-spacing:3px; }

  #teams {
    position:fixed; top:90px; left:20px; z-index:100;
    display:flex; flex-direction:column; gap:8px;
  }
  .team-badge {
    display:flex; align-items:center; gap:8px;
    background: rgba(0,15,35,0.82); border: 1px solid rgba(0,200,255,0.18);
    border-radius:4px; padding: 7px 12px;
    font-family:'Share Tech Mono', monospace; font-size:10px; color:#c8e8ff;
    backdrop-filter: blur(6px); transition: all 0.2s;
    cursor:pointer; text-align:left; width:100%;
  }
  .team-badge:hover { border-color: var(--accent); box-shadow: var(--glow); transform: translateX(2px); }
  .team-badge.is-active {
    background: rgba(0,30,55,0.92);
    box-shadow: var(--glow);
  }
  .team-badge.is-dimmed { opacity: 0.35; }
  .mode-badge { border-style: dashed; margin-bottom: 4px; }

  /* "Alle Diplomarbeiten" – Gold-Button */
  #show-all {
    border-color: rgba(197,131,18,0.55);
    color: #e9c074; letter-spacing: 0.5px;
  }
  #show-all .ba-label { color: #e9c074; font-weight: 600; }
  #show-all .team-dot { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  #show-all:hover {
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(197,131,18,0.55);
  }
  #show-all.is-active {
    background: rgba(197,131,18,0.18);
    border-color: var(--gold);
    box-shadow: 0 0 22px rgba(197,131,18,0.55);
  }
  #show-all.is-active .ba-label { color: #ffd98a; }
  .team-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow: 0 0 6px currentColor; }
  .team-count {
    margin-left:auto; font-size:9px; opacity:0.6; padding-left:10px;
  }

  #filter-reset {
    display:flex; align-items:center; gap:6px;
    margin-top:2px; padding:6px 12px;
    border:1px dashed rgba(0,200,255,0.35); border-radius:4px;
    font-family:'Share Tech Mono', monospace; font-size:9.5px; letter-spacing:1px;
    color: rgba(0,200,255,0.75); cursor:pointer; background:rgba(0,15,35,0.6);
    transition: all 0.2s; display:none;
  }
  #filter-reset.visible { display:flex; }
  #filter-reset:hover { color:#fff; border-color:var(--accent); box-shadow: var(--glow); }

  #counter {
    position:fixed; top:90px; right:20px; z-index:100; text-align:right;
  }
  .count-box {
    background: rgba(0,15,35,0.85); border: 1px solid rgba(0,200,255,0.25);
    border-radius:6px; padding:12px 18px; backdrop-filter:blur(8px);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .count-num {
    font-family:'Orbitron', monospace; font-size:42px; font-weight:900;
    color: var(--accent); text-shadow: 0 0 30px rgba(0,200,255,0.8); line-height:1;
    transition: color 0.3s, text-shadow 0.3s;
  }
  .count-label { font-family:'Share Tech Mono', monospace; font-size:9px; letter-spacing:2px; color: rgba(0,200,255,0.5); margin-top:3px; }

  #detail-panel {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:200; width:min(580px, 92vw);
    background: rgba(0,10,25,0.96); border: 1px solid var(--accent);
    border-radius:10px; padding:20px 24px; backdrop-filter: blur(18px);
    box-shadow: 0 0 50px rgba(0,200,255,0.2), inset 0 0 40px rgba(0,200,255,0.03);
    display:none; animation: slide-up 0.3s ease;
  }
  @keyframes slide-up {
    from { transform: translateX(-50%) translateY(20px); opacity:0; }
    to   { transform: translateX(-50%) translateY(0);    opacity:1; }
  }
  #detail-panel.visible { display:block; }
  .panel-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .panel-title { font-family:'Orbitron', monospace; font-size:15px; font-weight:700; color: var(--accent); text-shadow: 0 0 10px rgba(0,200,255,0.5); }
  .panel-team { font-family:'Share Tech Mono', monospace; font-size:10px; padding:3px 9px; border-radius:20px; border:1px solid; white-space:nowrap; flex-shrink:0; }
  .panel-close { background:none; border:none; color:rgba(0,200,255,0.5); font-size:18px; cursor:pointer; padding:0 0 0 8px; transition: color 0.2s; }
  .panel-close:hover { color: var(--accent2); }
  .panel-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .panel-field { background: rgba(0,30,60,0.5); border-radius:5px; padding:8px 10px; border-left:2px solid; }
  .field-label { font-family:'Share Tech Mono', monospace; font-size:8px; letter-spacing:2px; color: rgba(0,200,255,0.45); text-transform:uppercase; margin-bottom:3px; }
  .field-val { font-size:12px; font-weight:600; color: #e0f4ff; }
  .panel-desc { font-size:12px; line-height:1.65; color: rgba(200,232,255,0.8); border-top:1px solid rgba(0,200,255,0.12); padding-top:10px; }

  #debug-box {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:10000;
    max-width:86vw; padding:14px 18px; white-space:pre-wrap; word-break:break-word;
    font-family:'Share Tech Mono', monospace; font-size:clamp(13px,1.3vw,30px); line-height:1.6;
    color:#e8f6ff; background:rgba(2,11,22,0.92); border:1px solid #c58312; border-radius:6px;
    pointer-events:none;
  }

  #hint {
    position:fixed; bottom:20px; right:20px; z-index:100;
    font-family:'Share Tech Mono', monospace; font-size:9px;
    color:rgba(0,200,255,0.3); text-align:right; line-height:2;
  }

  /* ── Handy ─────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    body { height:100dvh; }

    /* kompakter Kopf, einzeilig */
    #header { padding:10px 14px; gap:10px; }
    #header > div:last-child { min-width:0; }
    .logo-icon { width:32px; height:32px; font-size:16px; flex-shrink:0; }
    h1 { font-size:11px; letter-spacing:1.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .subtitle { font-size:8px; letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* Team-Filter als horizontal wischbare Chip-Leiste statt Spalte über dem Globus */
    #teams {
      top:56px; left:0; right:0; max-width:none;
      flex-direction:row; align-items:center; gap:6px;
      padding:2px 12px 8px;
      overflow-x:auto; overscroll-behavior-x:contain;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    #teams::-webkit-scrollbar { display:none; }
    .team-badge { width:auto; flex:0 0 auto; white-space:nowrap; font-size:10px; padding:9px 12px; }
    .team-badge:hover { transform:none; }
    .mode-badge { margin-bottom:0; }
    .team-count { margin-left:4px; padding-left:2px; }
    #filter-reset { flex:0 0 auto; white-space:nowrap; margin-top:0; padding:9px 12px; }

    /* Zähler klein nach unten links, Hinweistext ausblenden */
    #counter { top:auto; bottom:12px; left:12px; right:auto; text-align:left; }
    .count-box { padding:7px 11px; }
    .count-num { font-size:22px; }
    .count-label { font-size:8px; letter-spacing:1px; }
    #hint { display:none; }

    /* Detailkarte: volle Breite, begrenzte Höhe, scrollbar */
    #detail-panel {
      bottom:10px; width:calc(100vw - 20px);
      padding:14px 16px; max-height:52dvh; overflow-y:auto;
    }
    .panel-title { font-size:13px; }
    .panel-grid { gap:6px; margin-bottom:10px; }
    .panel-field { padding:6px 8px; }
    .field-val { font-size:11.5px; }
    .panel-desc { font-size:11.5px; line-height:1.55; }
    .panel-close { font-size:20px; padding:4px 2px 4px 10px; }
  }
</style>
</head>
<body>
<div id="canvas-wrapper"><canvas id="globe"></canvas></div>

<header id="header">
  <div class="logo-icon">🌐</div>
  <div>
    <h1>Cyber Attack Big Picture</h1>
    <div class="subtitle">Network &amp; Cyber Attack Taxonomy — Diplomarbeiten 2023/27</div>
  </div>
</header>

<div id="teams"></div>

<div id="counter">
  <div class="count-box">
    <div class="count-num" id="count-num">0</div>
    <div class="count-label" id="count-label">ATTACK SCENARIOS</div>
  </div>
</div>

<div id="detail-panel">
  <div class="panel-header">
    <div><div class="panel-title" id="p-title">—</div></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="panel-team" id="p-team">—</div>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
  </div>
  <div class="panel-grid">
    <div class="panel-field" id="pf-layer"><div class="field-label">OSI Layer</div><div class="field-val" id="p-layer">—</div></div>
    <div class="panel-field" id="pf-cat"><div class="field-label">Kategorie</div><div class="field-val" id="p-cat">—</div></div>
    <div class="panel-field" id="pf-sev"><div class="field-label">Schweregrad</div><div class="field-val" id="p-sev">—</div></div>
    <div class="panel-field" id="pf-proto"><div class="field-label">Protokoll</div><div class="field-val" id="p-proto">—</div></div>
  </div>
  <div class="panel-desc" id="p-desc">—</div>
</div>

<div id="hint">KLICK TEAM → Filter<br>KLICK SATELLIT → Details · ESC → Schließen<br>DRAG → Drehen · SCROLL / PINCH → Zoom</div>

const TEAM_ORDER = ['Matryoshka','Kobayashi-Maru','Rasputin','BBB','Zerosec'];

    'Routing Attack':'⇄','Code Injection':'⌥','KI-gestützte Täuschung':'◈',
    'Spyware / Malware':'⚠','Social Engineering':'◉','Network Manipulation':'⬡',
    'VoIP Attack':'☎','WLAN Attack':'⌁','Kryptografischer Angriff':'⚿',
    'DoS/DDoS':'⚡','Web Attack':'⬡','Exploitation':'⚔','Privilege Escalation':'▲',
    'IoT Attack':'📡','Password Attack':'🔑','Forensik & Analyse':'🔍',
    'Steganographie':'🖼','Physischer Angriff':'🛰','Side-Channel':'📈','Sonstiges':'🔒',

}

// Gleichmäßige Verteilung der Knoten auf der Kugel (Fibonacci-Sphere),
// damit die Weltkarte unabhängig von der Themenanzahl aufgeräumt aussieht.
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
function sphereLatLon(i, total){
  const y = (1 - (i/(total-1))*2) * 0.82;
  const radius = Math.sqrt(Math.max(0, 1 - y*y));
  const theta = GOLDEN_ANGLE * i;
  const x = Math.cos(theta)*radius, z = Math.sin(theta)*radius;
  return { lat: Math.asin(y)*180/Math.PI, lon: Math.atan2(z,x)*180/Math.PI };
}
const ATTACKS = ATTACKS_RAW.map((a,i)=>{
  const {lat,lon} = sphereLatLon(i, ATTACKS_RAW.length);
  return Object.assign({ id:i, lat, lon }, a);
});

// Standardansicht: 5 Übungen je DA. Team-Klick filtert auf nur diese eine DA
// (alle ihre Übungen, auch bei Matryoshka).
let selectedTeam = null; // gesetzt = nur diese DA vollständig anzeigen
let showAll = false;     // true = alle DAs mit allen Übungen anzeigen
const GOLD = '#c58312';  // Matryoshka-Gold

// TEST: Knoten (Diplomarbeitsaufgaben) als Satelliten darstellen.
// Auf false setzen für die alte Form-/Emoji-Darstellung.
const SATELLITE_MODE = true;

const PER_TEAM_DEFAULT = 5; // Anzahl Themen je DA in der Standardansicht
function topNOfTeam(team, n){
  const items=ATTACKS.filter(a=>a.team===team);
  const showcase=items.filter(a=>a.showcase);
  const rest=items.filter(a=>!a.showcase);
  return showcase.concat(rest).slice(0,n);
}

function visibleAttacks(){
  if(showAll) return ATTACKS;
  if(selectedTeam) return ATTACKS.filter(a=>a.team===selectedTeam);
  return TEAM_ORDER.flatMap(team=>topNOfTeam(team, PER_TEAM_DEFAULT));
}

function buildTeamPanel(){
  const wrap=document.getElementById('teams');
  wrap.innerHTML='';

  // Gold-Button: alle Diplomarbeiten mit allen Übungen
  const allBtn=document.createElement('button');
  allBtn.id='show-all';
  allBtn.className='team-badge mode-badge';
  allBtn.innerHTML=`<span class="team-dot"></span><span class="ba-label">ALLE DA · ALLE ÜBUNGEN</span><span class="team-count">${ATTACKS.length}</span>`;
  allBtn.addEventListener('click', toggleShowAll);
  wrap.appendChild(allBtn);

  for(const team of TEAM_ORDER){
    const total=ATTACKS.filter(a=>a.team===team).length;
    const btn=document.createElement('button');
    btn.className='team-badge';
    btn.dataset.team=team;
    btn.style.color=TEAMS[team].color;
    btn.innerHTML=`<span class="team-dot" style="background:${TEAMS[team].color}"></span><span style="color:#c8e8ff">${team}</span><span class="team-count">${total}</span>`;
    btn.addEventListener('click', ()=>toggleTeam(team));
    wrap.appendChild(btn);
  }
  const reset=document.createElement('div');
  reset.id='filter-reset';
  reset.innerHTML='✕ FILTER ZURÜCKSETZEN';
  reset.addEventListener('click', ()=>setTeamFilter(null));
  wrap.appendChild(reset);
}

function toggleTeam(team){ setTeamFilter(selectedTeam===team ? null : team); }
function setTeamFilter(team){
  selectedTeam=team;
  showAll=false;
  closePanel();
  refreshTeamUI();
}
function toggleShowAll(){
  showAll=!showAll;
  selectedTeam=null;
  closePanel();
  refreshTeamUI();
}
function refreshTeamUI(){
  document.querySelectorAll('.team-badge[data-team]').forEach(btn=>{
    const t=btn.dataset.team;
    btn.classList.toggle('is-active', selectedTeam===t);
    btn.classList.toggle('is-dimmed', (!!selectedTeam && selectedTeam!==t) || showAll);
  });
  const allBtn=document.getElementById('show-all');
  if(allBtn) allBtn.classList.toggle('is-active', showAll);
  document.getElementById('filter-reset').classList.toggle('visible', !!selectedTeam || showAll);
  const list=visibleAttacks();
  document.getElementById('count-num').textContent=list.length;
  document.getElementById('count-label').textContent = showAll
    ? 'ALLE DA · ALLE ÜBUNGEN'
    : selectedTeam
      ? selectedTeam.toUpperCase()+' · THEMEN'
      : '5 THEMEN JE DA';
  const countBox=document.querySelector('.count-box');
  const col = showAll ? GOLD : (selectedTeam ? TEAMS[selectedTeam].color : '#00c8ff');
  countBox.style.borderColor = (selectedTeam || showAll) ? col+'80' : 'rgba(0,200,255,0.25)';
  document.getElementById('count-num').style.color = col;
}
buildTeamPanel();
refreshTeamUI();

let renderScale=1;       // Zeichenpixel je CSS-Pixel
let blankCheckAt=20, blankRetries=0, blankState='offen';
let lastError='';

let UIS=1;               // UI-Skalierung für große Viewports (siehe resize)
const UI_BOOST=(()=>{ const v=parseFloat(QS.get('scale')); return v>=0.5&&v<=4 ? v : 1; })();

// Canvas in Gerätepixeln rendern (scharf auf HiDPI-Displays), gerechnet wird in CSS-Pixeln
function resize(){
  W=window.innerWidth||document.documentElement.clientWidth||1280;
  H=window.innerHeight||document.documentElement.clientHeight||720;
  // Zeichenfläche auf das Pixelbudget begrenzen: ein 4K-Canvas überfordert die
  // Grafik eingebauter Android-Systeme (Canvas bleibt leer oder ruckelt stark).
  // CSS streckt die kleinere Zeichenfläche wieder auf die volle Fläche.
  let dpr=Math.min(window.devicePixelRatio||1, 2);
  if(W*H*dpr*dpr>maxPixels) dpr=Math.sqrt(maxPixels/(W*H));
  renderScale=dpr; blankCheckAt=animFrame+20;
  canvas.width=Math.max(1,Math.round(W*dpr)); canvas.height=Math.max(1,Math.round(H*dpr));
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // auf schmalen Displays den Globus etwas größer – die Seitenleisten entfallen dort
  cx=W/2; cy=H/2; R=Math.min(W,H)*(W<720?0.31:0.28);

  // Großbild-Skalierung (z. B. iiyama ProLite TE8603MIS, 86" 4K UHD 3840×2160):
  // Bezugsgröße ist Full HD. Ist der Viewport größer, wachsen Bedienelemente,
  // Schrift und Satelliten proportional mit – bei 3840×2160 also Faktor 2.
  // Feinjustierung am Gerät per URL: bigpicture.html?scale=1.2
  UIS=Math.max(1, Math.min(W/1920, H/1080))*UI_BOOST;
  document.documentElement.style.setProperty('--ui', UIS.toFixed(3));
}
let IS_TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
// Touch-Displays mit angeschlossener Maus melden oft "fine" – beim ersten Touch umschalten
window.addEventListener('touchstart',()=>{ IS_TOUCH=true; },{passive:true, once:true});
resize(); window.addEventListener('resize',resize);

function latLonTo3D(lat,lon){
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return { x:-Math.sin(phi)*Math.cos(theta), y:Math.cos(phi), z:Math.sin(phi)*Math.sin(theta) };
}
function rotate3D(p){
  let x=p.x*Math.cos(rotY)+p.z*Math.sin(rotY), z=-p.x*Math.sin(rotY)+p.z*Math.cos(rotY), y=p.y;
  let y2=y*Math.cos(rotX)-z*Math.sin(rotX), z2=y*Math.sin(rotX)+z*Math.cos(rotX);
  return {x,y:y2,z:z2};
}
function project(p3){ const r=R*zoom; return {sx:cx+p3.x*r, sy:cy-p3.y*r, z:p3.z}; }

const GRID_LATS=[], GRID_LONS=[];
for(let l=-80;l<=80;l+=20) GRID_LATS.push(l);
for(let l=-180;l<180;l+=20) GRID_LONS.push(l);

// ── Continent outlines (simplified polygons) ────────────────────────────
// Statt echter Erd-Küstenlinien entstehen hier frei erfundene Fantasie-Landmassen:
// unregelmäßige Blob-Formen aus überlagerten Sinus-Harmonischen, mit festem Seed
// (damit die Karte bei jedem Laden gleich aussieht, aber nie wie die reale Welt).
function mulberry32(seed){
  let t=seed>>>0;
  return function(){
    t+=0x6D2B79F5; let x=t;
    x=Math.imul(x^x>>>15, x|1);
    x^=x+Math.imul(x^x>>>7, x|61);
    return ((x^x>>>14)>>>0)/4294967296;
  };
}
function fantasyLandmass(seed, centerLat, centerLon, radiusDeg, irregularity, steps){
  const rng=mulberry32(seed);
  // Zufällige Kontrollpunkte rund um den Mittelpunkt, zweifach geglättet,
  // statt periodischer Sinus-Harmonischer — das vermeidet symmetrische "Blütenblätter"
  // und ergibt stattdessen unregelmäßige, organische Küstenlinien.
  const N = 9 + Math.floor(rng()*3); // 9–11 Kontrollpunkte
  let ctrl = Array.from({length:N}, ()=> 1 + (rng()-0.5)*2*irregularity);
  for(let pass=0; pass<2; pass++){
    ctrl = ctrl.map((v,i)=>{
      const prev=ctrl[(i-1+N)%N], next=ctrl[(i+1)%N];
      return (prev + v*2 + next) / 4;
    });
  }
  const poly=[];
  for(let s=0;s<=steps;s++){
    const t=(s/steps)*N;
    const i0=Math.floor(t)%N, i1=(i0+1)%N;
    const f=t-Math.floor(t);
    const ease=f*f*(3-2*f);
    const rr=radiusDeg*Math.max(0.35, ctrl[i0]*(1-ease)+ctrl[i1]*ease);
    const ang=(s/steps)*Math.PI*2;
    const dLat=rr*Math.cos(ang);
    const dLon=rr*Math.sin(ang)/Math.max(0.18,Math.cos(centerLat*Math.PI/180));
    poly.push([centerLat+dLat, centerLon+dLon]);
  }
  return poly;
}

function drawGlobe(){
  const r=R*zoom;
  const filterCol = selectedTeam ? TEAMS[selectedTeam].color : null;

  // Deep space background glow around globe
  const spaceglow = ctx.createRadialGradient(cx,cy,r*0.6, cx,cy,r*2.2);
  spaceglow.addColorStop(0,'rgba(0,40,80,0.0)');
  spaceglow.addColorStop(0.5,'rgba(0,20,50,0.12)');
  spaceglow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=spaceglow; ctx.beginPath(); ctx.arc(cx,cy,r*2.2,0,Math.PI*2); ctx.fill();

  // Atmosphere — tinted toward the active team color when filtered
  const atm=ctx.createRadialGradient(cx,cy,r*0.88, cx,cy,r*1.3);
  atm.addColorStop(0, filterCol ? filterCol+'38' : 'rgba(0,100,200,0.22)');
  atm.addColorStop(0.5, filterCol ? filterCol+'18' : 'rgba(0,60,140,0.09)');
  atm.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(cx,cy,r*1.3,0,Math.PI*2); ctx.fill();

  // Ocean – alienblauer Abgrund statt Erdblau, leicht ins Violette
  const ocean=ctx.createRadialGradient(cx-r*0.25,cy-r*0.25,0, cx,cy,r);
  ocean.addColorStop(0,'#1a2f82');
  ocean.addColorStop(0.45,'#141a52');
  ocean.addColorStop(1,'#07061c');
  ctx.fillStyle=ocean; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Subtiles Schimmern in HUD-Cyan
  const shimmer=ctx.createRadialGradient(cx-r*0.4,cy-r*0.4,0, cx,cy,r*0.8);
  shimmer.addColorStop(0,'rgba(0,180,255,0.14)');
  shimmer.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shimmer; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Clip to globe for grid & continents
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();

  // Grid lines
  ctx.lineWidth=0.5;
  for(const lat of GRID_LATS){
    ctx.beginPath(); let first=true;
    for(let lon=-180;lon<=180;lon+=3){
      const {sx,sy,z}=project(rotate3D(latLonTo3D(lat,lon)));
      if(z<-0.05){first=true;continue;}
      first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
    }
    ctx.strokeStyle=lat===0?'rgba(0,200,255,0.22)':'rgba(0,200,255,0.07)'; ctx.stroke();
  }
  for(const lon of GRID_LONS){
    ctx.beginPath(); let first=true;
    for(let lat=-90;lat<=90;lat+=3){
      const {sx,sy,z}=project(rotate3D(latLonTo3D(lat,lon)));
      if(z<-0.05){first=true;continue;}
      first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
    }
    ctx.strokeStyle=lon===0?'rgba(0,200,255,0.18)':'rgba(0,200,255,0.06)'; ctx.stroke();
  }

  // Fantasie-Landmassen – eingefärbte Blobs statt echter Erdkontinente
  for(const {poly, palette} of CONTINENTS){
    ctx.beginPath();
    let penDown=false, minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    const pts=[];
    for(const pt of poly){
      const p3=rotate3D(latLonTo3D(pt[0],pt[1]));
      const {sx,sy,z}=project(p3);
      if(z<0.02){penDown=false;continue;}
      penDown?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);
      penDown=true;
      pts.push(sx,sy);
      if(sx<minX)minX=sx; if(sx>maxX)maxX=sx; if(sy<minY)minY=sy; if(sy>maxY)maxY=sy;
    }
    ctx.closePath();
    if(pts.length>=4){
      const land=ctx.createLinearGradient(minX,minY,maxX,maxY);
      land.addColorStop(0,palette.fill0);
      land.addColorStop(1,palette.fill1);
      ctx.fillStyle=land;
    } else {
      ctx.fillStyle=palette.fill0;
    }
    ctx.fill();
    ctx.strokeStyle=palette.edge;
    ctx.lineWidth=0.9;
    ctx.shadowColor=palette.edge; ctx.shadowBlur=4;
    ctx.stroke();
    ctx.shadowBlur=0;

    // Platinen-Leiterbahnen innerhalb der Landmasse (Cybersec-Look)
    if(pts.length>=4 && maxX>minX && maxY>minY){
      ctx.save();
      ctx.clip();
      ctx.strokeStyle=palette.edge.replace(/[\d.]+\)$/,'0.3)');
      ctx.lineWidth=0.6;
      const cols=4, rowStep=(maxY-minY)/3;
      for(let i=1;i<cols;i++){
        const x=minX+(maxX-minX)*(i/cols);
        ctx.beginPath(); ctx.moveTo(x,minY); ctx.lineTo(x,maxY); ctx.stroke();
      }
      for(let y=minY+rowStep; y<maxY; y+=rowStep){
        ctx.beginPath(); ctx.moveTo(minX,y); ctx.lineTo(maxX,y); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Polare Daten-Cluster — kühles Cyan-Weiß statt Eis
  for(const poleLat of [78,-78]){
    ctx.beginPath(); let first=true;
    for(let lon=-180;lon<=180;lon+=5){
      const p3=rotate3D(latLonTo3D(poleLat,lon));
      const {sx,sy,z}=project(p3);
      if(z<0){first=true;continue;}
      first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
    }
    ctx.closePath();
    ctx.fillStyle='rgba(180,230,255,0.16)';
    ctx.fill();
  }

  // Specular highlight
  const spec=ctx.createRadialGradient(cx-r*0.35,cy-r*0.38,0, cx-r*0.2,cy-r*0.2,r*0.7);
  spec.addColorStop(0,'rgba(180,230,255,0.18)');
  spec.addColorStop(0.4,'rgba(100,180,255,0.05)');
  spec.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=spec; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Soft vignette toward the rim for more depth
  const vig=ctx.createRadialGradient(cx,cy,r*0.7, cx,cy,r);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle=vig; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // Outer rim glow — reacts to the active filter color
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  const rimGrad=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
  const rc = filterCol || '#00c8ff';
  rimGrad.addColorStop(0, rc+'80');
  rimGrad.addColorStop(0.5, rc+'33');
  rimGrad.addColorStop(1, rc+'80');
  ctx.strokeStyle=rimGrad; ctx.lineWidth=filterCol?2.6:2; ctx.stroke();
}

// ── Node drawing helpers ─────────────────────────────────────────────────
function drawShape(type, x, y, r, ctx){
  ctx.beginPath();
  switch(type){
    case 'diamond':
      ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.75, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r*0.75, y); ctx.closePath(); break;
    case 'hexagon':
      for(let i=0;i<6;i++){ const a=i*Math.PI/3-Math.PI/6; ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } ctx.closePath(); break;
    case 'triangle':
      ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.87, y+r*0.5); ctx.lineTo(x-r*0.87, y+r*0.5); ctx.closePath(); break;
    case 'square':
      ctx.rect(x-r*0.78,y-r*0.78,r*1.56,r*1.56); break;
    default:
      ctx.arc(x,y,r,0,Math.PI*2);
  }
}

// Zeichnet einen kleinen Satelliten: Korpus + zwei Solarpaneele + Antenne.
// col/glow = Teamfarbe, damit die DAs weiterhin unterscheidbar bleiben.
function drawSatellite(sx, sy, R, col, glow, isHov, seed){
  ctx.save();
  ctx.translate(sx, sy);
  // sanftes Taumeln, pro Knoten leicht versetzt
  const ang = Math.sin(animFrame*0.02 + seed*1.3)*0.2 + (seed%6.283)*0.5;
  ctx.rotate(ang);

  const bodyW = R*1.05, bodyH = R*0.8;
  const panelW = R*1.25, panelH = R*0.9;
  const arm = R*0.35;
  const edge = col + (isHov ? 'ff' : 'cc');

  // ── Trägerarme zu den Paneelen ──
  ctx.strokeStyle = edge;
  ctx.lineWidth = Math.max(1, R*0.14);
  ctx.beginPath();
  ctx.moveTo(-bodyW/2, 0); ctx.lineTo(-bodyW/2-arm, 0);
  ctx.moveTo( bodyW/2, 0); ctx.lineTo( bodyW/2+arm, 0);
  ctx.stroke();

  // ── Solarpaneele (links & rechts) mit Zellraster ──
  function panel(sign){
    const x0 = sign*(bodyW/2+arm), y0 = -panelH/2;
    const px = sign>0 ? x0 : x0-panelW;
    const grad = ctx.createLinearGradient(px, y0, px, y0+panelH);
    grad.addColorStop(0, '#12365e');
    grad.addColorStop(1, '#06182f');
    ctx.fillStyle = grad;
    ctx.fillRect(px, y0, panelW, panelH);
    // Rasterlinien in Teamfarbe
    ctx.strokeStyle = col + '55';
    ctx.lineWidth = Math.max(0.5, R*0.04);
    for(let c=1;c<3;c++){ const gx=px+panelW*c/3; ctx.beginPath(); ctx.moveTo(gx,y0); ctx.lineTo(gx,y0+panelH); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px+panelW,0); ctx.stroke();
    // Rahmen
    ctx.strokeStyle = edge;
    ctx.lineWidth = Math.max(0.8, R*0.08);
    ctx.strokeRect(px, y0, panelW, panelH);
  }
  panel(-1); panel(1);

  // ── Korpus (metallisch) ──
  const bg = ctx.createLinearGradient(0,-bodyH/2,0,bodyH/2);
  bg.addColorStop(0, isHov ? '#ffffff' : '#d7e6f5');
  bg.addColorStop(1, '#5c7487');
  ctx.fillStyle = bg;
  const bx=-bodyW/2, by=-bodyH/2, br=R*0.18;
  ctx.beginPath();
  ctx.moveTo(bx+br,by);
  ctx.arcTo(bx+bodyW,by,bx+bodyW,by+bodyH,br);
  ctx.arcTo(bx+bodyW,by+bodyH,bx,by+bodyH,br);
  ctx.arcTo(bx,by+bodyH,bx,by,br);
  ctx.arcTo(bx,by,bx+bodyW,by,br);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = edge; ctx.lineWidth = Math.max(1, R*0.1); ctx.stroke();

  // ── Antenne / Parabolschüssel oben ──
  ctx.strokeStyle = edge; ctx.lineWidth = Math.max(1, R*0.1);
  ctx.beginPath(); ctx.moveTo(0,-bodyH/2); ctx.lineTo(0,-bodyH/2-R*0.45); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0,-bodyH/2-R*0.55, R*0.22, 0, Math.PI*2); ctx.fill();

  // ── Leuchtendes "Auge" im Korpus ──
  ctx.fillStyle = isHov ? '#ffffff' : col;
  ctx.shadowColor = glow; ctx.shadowBlur = (isHov?12:6);
  ctx.beginPath(); ctx.arc(0,0,R*0.18,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

// ── Umlaufbahnen (Orbits) ─────────────────────────────────────────────────
// Jede Diplomarbeitsaufgabe bekommt deterministisch eine eigene Umlaufbahn:
// Höhe (rad), Inklination, Knotenlänge, Startphase, Geschwindigkeit/Richtung.
function satOrbit(id){
  const f=(n)=>{ const x=Math.sin(id*12.9898 + n*78.233)*43758.5453; return x-Math.floor(x); };
  return {
    rad:   1.18 + f(1)*0.30,              // Bahnhöhe über der Kugel
    inc:   f(2)*Math.PI,                  // Bahnneigung
    asc:   f(3)*Math.PI*2,                // Lage der Bahnebene
    phase: f(4)*Math.PI*2,                // Startposition
    speed: (0.0016 + f(5)*0.0024) * (f(6)<0.5?1:-1), // Tempo + Umlaufrichtung
  };
}
// Punkt auf der Bahn bei Winkel th (Welt-Koordinaten, vor der Ansichtsrotation)
function satPointAtAngle(o, th){
  let x=Math.cos(th)*o.rad, y=Math.sin(th)*o.rad, z=0;
  // Inklination um X-Achse
  let y1=y*Math.cos(o.inc)-z*Math.sin(o.inc);
  let z1=y*Math.sin(o.inc)+z*Math.cos(o.inc);
  // Knotenlänge um Y-Achse
  let x2=x*Math.cos(o.asc)+z1*Math.sin(o.asc);
  let z2=-x*Math.sin(o.asc)+z1*Math.cos(o.asc);
  return {x:x2, y:y1, z:z2};
}
function satPos3D(o, t){ return satPointAtAngle(o, o.phase + o.speed*t); }

// Bahn im "Alle DA"-Modus: alle Satelliten einer DA (gleiche Farbe) teilen sich
// einen eigenen Orbit. Die Bahnebenen der DAs sind unterschiedlich geneigt und
// gedreht, sodass die Orbits zusammen die ganze Erde umspannen.
function teamOrbit(atk){
  if(!atk._oAll){
    const idx=TEAM_ORDER.indexOf(atk.team);
    const nTeams=TEAM_ORDER.length;
    const members=ATTACKS.filter(a=>a.team===atk.team);
    const k=members.indexOf(atk);
    const n=members.length;
    // Neigung gegenüber dem Äquator: von flach (0.2 rad) bis steil (~1.35 rad)
    const tilt = 0.2 + idx*(1.15/Math.max(1,nTeams-1));
    atk._oAll={
      rad:   1.2 + idx*0.06,                        // eigene Höhe pro DA
      inc:   Math.PI/2 - tilt,                      // PI/2 = Äquatorebene
      asc:   idx*(Math.PI*2/nTeams) + 0.3,          // Bahnebenen rundum verteilt
      phase: (k/n)*Math.PI*2,                       // gleichmäßig verteilt auf dem Ring
      speed: 0.0022*(idx%2 ? 1 : -1),               // gleiches Tempo je DA
    };
  }
  return atk._oAll;
}
// Aktive Bahn eines Knotens: Team-Ring im "Alle"-Modus, sonst eigene Bahn
function getOrbit(atk){
  if(!atk._o) atk._o = satOrbit(atk.id);
  return allBlend>0.5 ? teamOrbit(atk) : atk._o;
}

// Weltposition eines Knotens: Satellit auf Umlaufbahn oder (alt) fix auf der Kugel.
// Beim Umschalten in den / aus dem "Alle"-Modus gleiten die Satelliten weich
// von ihrer Einzelbahn auf den DA-Ring (und zurück), statt zu springen.
function worldPos3D(atk){
  if(!SATELLITE_MODE) return latLonTo3D(atk.lat, atk.lon);
  if(!atk._o) atk._o = satOrbit(atk.id);
  if(allBlend<=0.001) return satPos3D(atk._o, animFrame);
  const to=teamOrbit(atk);
  const b=satPos3D(to, animFrame);
  if(allBlend>=0.999) return b;
  const a=satPos3D(atk._o, animFrame);
  const t=allBlend*allBlend*(3-2*allBlend);
  const x=a.x+(b.x-a.x)*t, y=a.y+(b.y-a.y)*t, z=a.z+(b.z-a.z)*t;
  const len=Math.hypot(x,y,z);
  if(len<0.05) return t<0.5 ? a : b;
  const s=(atk._o.rad+(to.rad-atk._o.rad)*t)/len; // auf Bahnhöhe halten, nicht durch die Kugel
  return {x:x*s, y:y*s, z:z*s};
}
// true, wenn der Punkt hinter der Kugel liegt (verdeckt)
function behindGlobe(p3){ return p3.z<0 && Math.hypot(p3.x,p3.y)<1.0; }

// Zeichnet eine Umlaufbahn als dünne Linie (Teil hinter der Kugel wird ausgeblendet)
function drawOrbit(o, col){
  const r=R*zoom;
  ctx.beginPath();
  let pen=false;
  for(let s=0;s<=72;s++){
    const th=(s/72)*Math.PI*2;
    const p3=rotate3D(satPointAtAngle(o, th));
    if(behindGlobe(p3)){ pen=false; continue; }
    const sx=cx+p3.x*r, sy=cy-p3.y*r;
    pen?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); pen=true;
  }
  ctx.strokeStyle=col+'2a'; ctx.lineWidth=UIS; ctx.stroke();
}

function drawNodes(){
  const list=visibleAttacks();
  const zs=zoom*UIS; // Größenfaktor für Satelliten/Schrift: Zoom × Großbild-Skalierung
  const nodes2d=[];
  for(const atk of list){
    const p3=rotate3D(worldPos3D(atk));
    const {sx,sy,z}=project(p3);
    let visible, alpha;
    if(SATELLITE_MODE){
      visible = !behindGlobe(p3);
      alpha = visible ? Math.max(0.3, Math.min(1,(z+1.25)/2.0)) : 0;
    } else {
      visible = z>-0.05;
      alpha = visible?Math.max(0.15,(z+0.05)/1.05):0;
    }
    nodes2d.push({atk,sx,sy,z,visible,alpha});
  }
  nodes2d.sort((a,b)=>a.z-b.z);
  const labelQueue=[];

  if(SATELLITE_MODE){
    // Umlaufbahnen hinter die Satelliten zeichnen (jede Bahn nur einmal,
    // im "Alle"-Modus teilen sich alle Satelliten einer DA eine Bahn)
    const drawnOrbits=new Set();
    for(const n of nodes2d){
      const o=getOrbit(n.atk);
      if(drawnOrbits.has(o)) continue;
      drawnOrbits.add(o);
      drawOrbit(o, TEAMS[n.atk.team].color);
    }
  } else {
    // Team connection lines (alte Konstellations-Linien)
    const teamMap={};
    for(const n of nodes2d){ const t=n.atk.team; if(!teamMap[t])teamMap[t]=[]; teamMap[t].push(n); }
    for(const [team,nodes] of Object.entries(teamMap)){
      const col=TEAMS[team].color;
      for(let i=0;i<nodes.length-1;i++){
        const a=nodes[i],b=nodes[i+1];
        if(!a.visible||!b.visible) continue;
        ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy);
        ctx.strokeStyle=col+'28'; ctx.lineWidth=1; ctx.setLineDash([4,7]); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  for(const nd of nodes2d){
    if(!nd.visible||nd.alpha<0.05) continue;
    const {atk,sx,sy,alpha}=nd;
    const col=TEAMS[atk.team].color;
    const glow=TEAMS[atk.team].glow;
    const isHov=hoveredNode===atk.id || selectedNode===atk.id;
    const baseR = SATELLITE_MODE ? (isHov?12:8) : (isHov?20:14);
    const pulse=Math.sin(animFrame*0.05+atk.id*1.1)*2.5;
    const shape=SHAPES[atk.cat];

    ctx.globalAlpha=alpha;

    // Outer pulse ring
    const ringR=(baseR+pulse+14)*zs;
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,ringR);
    g.addColorStop(0,glow); g.addColorStop(0.5,glow.replace('0.7','0.2')); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,ringR,0,Math.PI*2); ctx.fill();

    if(SATELLITE_MODE){
      // TEST: Satelliten-Darstellung
      drawSatellite(sx, sy, baseR*zs, col, glow, isHov, atk.id);
    } else {
      // Animated outer ring stroke
      ctx.save();
      ctx.strokeStyle=col+(isHov?'cc':'66');
      ctx.lineWidth=(isHov?2.5:1.5)*zs;
      drawShape(shape,sx,sy,(baseR+6)*zs,ctx);
      ctx.stroke(); ctx.restore();

      // Main node fill
      ctx.save();
      const fillGrad=ctx.createRadialGradient(sx-baseR*0.3*zs,sy-baseR*0.3*zs,0,sx,sy,baseR*zs);
      fillGrad.addColorStop(0,isHov?'#ffffff':col+'ff');
      fillGrad.addColorStop(1,isHov?col+'bb':col+'99');
      ctx.fillStyle=fillGrad;
      drawShape(shape,sx,sy,baseR*zs,ctx);
      ctx.fill();
      ctx.strokeStyle=isHov?'#fff':col+'aa';
      ctx.lineWidth=isHov?2.5:1.5;
      ctx.stroke(); ctx.restore();

      // Inner icon emoji
      ctx.save();
      ctx.font=`${Math.round((baseR*0.9)*zs)}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha=alpha*(isHov?1:0.9);
      ctx.fillStyle=isHov?col:'#fff';
      ctx.fillText(getCatEmoji(atk.cat),sx,sy+1);
      ctx.restore();
    }

    // Label
    if((showAll || W<720) && SATELLITE_MODE){
      // im "Alle"-Modus separat (lesbarer, ohne Überlappung) – siehe drawAllLabels
      if(alpha>0.35||isHov) labelQueue.push({atk,sx,sy,z:nd.z,alpha,col,baseR,isHov});
    } else if(alpha>0.35||isHov){
      ctx.save();
      ctx.font=`${isHov?'bold ':''} ${Math.round(11*zs)}px 'Exo 2', sans-serif`;
      ctx.fillStyle=col;
      ctx.textAlign='center';
      ctx.shadowColor=col; ctx.shadowBlur=isHov?18:8;
      ctx.fillText(atk.name, sx, sy-(baseR+12)*zs);
      ctx.shadowBlur=0;
      if(isHov){
        ctx.font=`${Math.round(9*zs)}px 'Share Tech Mono', monospace`;
        ctx.fillStyle='rgba(200,232,255,0.65)';
        ctx.fillText('['+atk.team+']', sx, sy-(baseR+25)*zs);
      }
      ctx.restore();
    }

    ctx.globalAlpha=1;
  }

  if(labelQueue.length) drawAllLabels(labelQueue);
}

// Lesbare Labels für den "Alle DA"-Modus: dunkle Hinterlegung, helle Schrift,
// Rahmen in Teamfarbe. Vordere Satelliten haben Vorrang; überlappende Labels
// weiter hinten werden ausgelassen (gehovertes Label wird immer gezeigt).
function drawAllLabels(queue){
  queue.sort((a,b)=> (b.isHov-a.isHov) || (b.z-a.z));
  const placed=[];
  const zs=zoom*UIS;
  const fs=Math.max(8*UIS, Math.round(9*zs));
  ctx.save();
  ctx.font=`500 ${fs}px 'Exo 2', sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const L of queue){
    const w=ctx.measureText(L.atk.name).width + 10*UIS;
    const h=fs + 6*UIS;
    const x=L.sx - w/2;
    const y=L.sy - (L.baseR+10)*zs - h;
    const hit=placed.some(p=> x < p.x+p.w+4 && x+w+4 > p.x && y < p.y+p.h+2 && y+h+2 > p.y);
    if(hit && !L.isHov) continue;
    placed.push({x,y,w,h});

    ctx.globalAlpha = L.isHov ? 1 : Math.max(0.75, L.alpha);
    // Hinterlegung
    ctx.fillStyle='rgba(2,11,22,0.88)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,4); else ctx.rect(x,y,w,h);
    ctx.fill();
    ctx.strokeStyle=L.col+(L.isHov?'ff':'99');
    ctx.lineWidth=L.isHov?1.5:1;
    ctx.stroke();
    // Text
    ctx.fillStyle = L.isHov ? '#ffffff' : '#e8f6ff';
    ctx.fillText(L.atk.name, L.sx, y + h/2 + 0.5);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

// Liefert den nächstgelegenen Satelliten unter dem Zeiger.
// Auf Touch-Geräten ist die Trefferfläche größer (Finger statt Mauszeiger).
function hitTest(mx,my){
  const zs=zoom*UIS;
  const maxD=Math.max(IS_TOUCH?30*UIS:0, (IS_TOUCH?32:22)*zs);
  let best=null, bestD=maxD;
  for(const atk of visibleAttacks()){
    const p3=rotate3D(worldPos3D(atk));
    const {sx,sy}=project(p3);
    if(SATELLITE_MODE ? behindGlobe(p3) : p3.z<0) continue;
    const d=Math.hypot(mx-sx,my-sy);
    if(d<bestD){ bestD=d; best=atk; }
  }
  return best;
}

function openPanel(atk){
  const col=TEAMS[atk.team].color;
  document.getElementById('p-title').textContent=atk.name;
  document.getElementById('p-team').textContent=atk.team;
  document.getElementById('p-team').style.color=col;
  document.getElementById('p-team').style.borderColor=col;
  document.getElementById('p-layer').textContent=atk.layer;
  document.getElementById('p-cat').textContent=atk.cat;
  document.getElementById('p-sev').textContent=atk.sev;
  document.getElementById('p-proto').textContent=atk.proto;
  document.getElementById('p-desc').textContent=atk.desc;
  ['pf-layer','pf-cat','pf-sev','pf-proto'].forEach(id=>{ document.getElementById(id).style.borderLeftColor=col; });
  document.getElementById('detail-panel').classList.add('visible');
  selectedNode=atk.id;
  autoRotate=false;
}
function closePanel(){ document.getElementById('detail-panel').classList.remove('visible'); hoveredNode=null; selectedNode=null; autoRotate=true; }

// Hover laufend neu bestimmen – die Satelliten bewegen sich auch bei ruhender Maus
function updateHover(){
  if(!mouseInside || dragging) return;
  const hit=hitTest(mouseX,mouseY);
  hoveredNode=hit?hit.id:null;
  canvas.style.cursor=hit?'pointer':'grab';
}

canvas.addEventListener('mousedown',e=>{ dragging=true; dragMoved=false; lastMX=e.clientX; lastMY=e.clientY; autoRotate=false; });
canvas.addEventListener('mousemove',e=>{
  mouseX=e.clientX; mouseY=e.clientY; mouseInside=true;
  if(dragging){
    const dx=e.clientX-lastMX, dy=e.clientY-lastMY;
    if(Math.hypot(dx,dy)>2) dragMoved=true;
    rotY+=dx*0.008; rotX+=dy*0.008;
    rotX=Math.max(-1.4,Math.min(1.4,rotX));
    lastMX=e.clientX; lastMY=e.clientY;
  } else {
    updateHover();
  }
});
canvas.addEventListener('mouseleave',()=>{
  mouseInside=false; hoveredNode=null;
  // Ziehen über den Rand hinaus sauber beenden, sonst bleibt der Globus "kleben"
  if(dragging){ dragging=false; if(selectedNode===null) autoRotate=true; }
});
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });
canvas.addEventListener('mouseup',e=>{
  if(!dragging) return;
  dragging=false;
  if(!dragMoved){
    const hit=hitTest(e.clientX,e.clientY);
    if(hit) openPanel(hit);
    else { closePanel(); autoRotate=true; }
  }
});
function clampZoom(){ zoom=Math.max(0.45,Math.min(2.8,zoom)); }
// preventDefault: sonst scrollt die einbettende Seite mit, während der Globus zoomt
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoom*=e.deltaY>0?0.92:1.09; clampZoom(); },{passive:false});

// Touch: ein Finger dreht, zwei Finger zoomen (Pinch)
let pinchDist=0, touchStartX=0, touchStartY=0;
function touchDist(e){ return Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){ pinchDist=touchDist(e); dragging=false; return; }
  const t=e.touches[0]; dragging=true; dragMoved=false;
  lastMX=touchStartX=t.clientX; lastMY=touchStartY=t.clientY; autoRotate=false;
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2){
    const d=touchDist(e);
    if(pinchDist>0){ zoom*=d/pinchDist; clampZoom(); }
    pinchDist=d;
    return;
  }
  if(!dragging) return;
  const t=e.touches[0];
  // kleines Zittern des Fingers zählt noch als Tippen, nicht als Ziehen
  if(!dragMoved && Math.hypot(t.clientX-touchStartX,t.clientY-touchStartY)<8) return;
  dragMoved=true;
  rotY+=(t.clientX-lastMX)*0.01; rotX+=(t.clientY-lastMY)*0.01;
  rotX=Math.max(-1.4,Math.min(1.4,rotX));
  lastMX=t.clientX; lastMY=t.clientY;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  // Tippen selbst auswerten; preventDefault unterdrückt die nachgelagerten
  // emulierten Maus-Events (sonst bliebe ein "Hover" an der Tippstelle hängen)
  if(e.cancelable) e.preventDefault();
  const wasTap = dragging && !dragMoved && e.touches.length===0;
  dragging=false; pinchDist=0;
  if(wasTap){
    const hit=hitTest(touchStartX,touchStartY);
    if(hit) openPanel(hit); else closePanel();
  }
  if(e.touches.length===0 && selectedNode===null) autoRotate=true;
},{passive:false});
canvas.addEventListener('touchcancel',()=>{ dragging=false; pinchDist=0; });

// Sterne einmalig erzeugen (feste Farbe je Stern, kein Flackern)
const STARS=[];
for(let i=0;i<220;i++) STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4,a:0.2+Math.random()*0.8,phase:Math.random()*Math.PI*2,hue:200+Math.random()*60});

let perfAcc=0, perfN=0, fpsNow=60;

// Selbsttest: In der Bildmitte liegt immer der (deckende) Globus. Ist der Pixel
// dort nach dem Zeichnen leer, konnte das Gerät die Zeichenfläche nicht darstellen
// – dann schrittweise mit kleinerer Fläche erneut versuchen.
function checkCanvasBlank(){
  let blank=false;
  try{
    const d=ctx.getImageData(Math.floor(canvas.width/2),Math.floor(canvas.height/2),1,1).data;
    blank = d[3]===0;
  }catch(err){ blankState='nicht prüfbar'; return; }
  if(!blank){ blankState='ok'; return; }
  if(blankRetries<5 && canvas.width*canvas.height>480*270){
    blankRetries++; blankState='leer – Versuch '+blankRetries;
    maxPixels=Math.max(480*270, canvas.width*canvas.height*0.5);
    resize();
  } else {
    blankState='leer';
  }
}

// Diagnose-Einblendung (?debug=1): zeigt, was die Seite über das Gerät erkennt
let debugEl=null;
if(DEBUG){
  debugEl=document.createElement('div');
  debugEl.id='debug-box';
  document.body.appendChild(debugEl);
}
function updateDebug(){
  if(!debugEl) return;
  debugEl.textContent=
    'Gerät: '+(IS_IIYAMA?'iiyama erkannt':(BIG_ANDROID?'Android-Großdisplay':(IS_ANDROID?'Android':'Desktop/sonstiges')))+
    '\nViewport: '+W+' × '+H+'  ·  Screen: '+screen.width+' × '+screen.height+'  ·  DPR: '+(window.devicePixelRatio||1)+
    '\nCanvas: '+canvas.width+' × '+canvas.height+'  ·  Render-Skalierung: '+renderScale.toFixed(2)+'  ·  UI-Skalierung: '+UIS.toFixed(2)+
    '\nFPS: '+fpsNow.toFixed(0)+'  ·  Touch: '+(IS_TOUCH?'ja':'nein')+'  ·  Canvas-Test: '+blankState+
    '\nFehler: '+(lastError||'keiner')+
    '\nUA: '+UA;
}

let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  // Zeitbasiert animieren: gleiche Geschwindigkeit auf 60-, 120- und 144-Hz-Displays
  if(typeof now!=='number') now=performance.now();
  const rawDt=now-lastT;
  const dt=Math.max(0, Math.min(3,rawDt/16.667));
  lastT=now;

  // Leistung beobachten: läuft es dauerhaft unter ~24 fps, Zeichenfläche verkleinern
  if(rawDt>0 && rawDt<500){ perfAcc+=rawDt; perfN++; fpsNow+=((1000/rawDt)-fpsNow)*0.1; }
  if(perfN>=45){
    const avg=perfAcc/perfN; perfAcc=0; perfN=0;
    if(avg>42 && canvas.width*canvas.height>640*360){
      maxPixels=Math.max(640*360, canvas.width*canvas.height*0.6);
      resize();
    }
  }
  animFrame+=dt;
  if(autoRotate) rotY+=0.0025*dt;

  // weiche Überblendung Einzelbahnen <-> DA-Ringe
  const target=showAll?1:0;
  allBlend+=(target-allBlend)*Math.min(1,0.06*dt);
  if(Math.abs(target-allBlend)<0.002) allBlend=target;

  updateHover();
  ctx.clearRect(0,0,W,H);

  for(const s of STARS){
    ctx.globalAlpha=s.a*(0.35+0.25*Math.sin(animFrame*0.018+s.phase));
    ctx.fillStyle=`hsl(${s.hue},80%,90%)`;
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r*UIS,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  drawGlobe();
  drawNodes();

  if(blankCheckAt>=0 && animFrame>=blankCheckAt){ blankCheckAt=-1; checkCanvasBlank(); }
  if(DEBUG && (Math.floor(animFrame)%15===0)) updateDebug();
}
loop();
</script>
</body>
</html>
