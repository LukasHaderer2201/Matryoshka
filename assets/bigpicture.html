// ─── CANVAS SETUP ─────────────────────────────────────────────────────────
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
let W,H,cx,cy,R;
let rotX=0.3, rotY=0;
let zoom=1;

function latLonTo3D(lat,lon){
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return { x:-Math.sin(phi)*Math.cos(theta), y:Math.cos(phi), z:Math.sin(phi)*Math.sin(theta) };
}
function rotate3D(p){
  let x=p.x*Math.cos(rotY)+p.z*Math.sin(rotY), z=-p.x*Math.sin(rotY)+p.z*Math.cos(rotY), y=p.y;
  let y2=y*Math.cos(rotX)-z*Math.sin(rotX), z2=y*Math.sin(rotX)+z*Math.cos(rotX);
  return {x,y:y2,z:z2};
}
function project(p3){ const r=R*zoom; return {sx:cx+p3.x*r, sy:cy-p3.y*r, z:p3.z}; }

function drawGlobe(){
  const r=R*zoom;

  // Deep space background glow around globe
  const spaceglow = ctx.createRadialGradient(cx,cy,r*0.6, cx,cy,r*2.2);
  spaceglow.addColorStop(0,'rgba(0,40,80,0.0)');
  spaceglow.addColorStop(0.5,'rgba(0,20,50,0.12)');
  spaceglow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=spaceglow; ctx.beginPath(); ctx.arc(cx,cy,r*2.2,0,Math.PI*2); ctx.fill();

  // Atmosphere
  const atm=ctx.createRadialGradient(cx,cy,r*0.88, cx,cy,r*1.28);
  atm.addColorStop(0,'rgba(0,100,200,0.22)');
  atm.addColorStop(0.5,'rgba(0,60,140,0.09)');
  atm.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(cx,cy,r*1.28,0,Math.PI*2); ctx.fill();

  // Ocean – rich deep blue with pole variation
  const ocean=ctx.createRadialGradient(cx-r*0.25,cy-r*0.25,0, cx,cy,r);
  ocean.addColorStop(0,'#0d3a6e');
  ocean.addColorStop(0.5,'#082040');
  ocean.addColorStop(1,'#030f22');
  ctx.fillStyle=ocean; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Subtle ocean shimmer
  const shimmer=ctx.createRadialGradient(cx-r*0.4,cy-r*0.4,0, cx,cy,r*0.8);
  shimmer.addColorStop(0,'rgba(0,160,255,0.10)');
  shimmer.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shimmer; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Clip to globe for grid & continents

  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();

  // Grid lines
  ctx.lineWidth=0.5;
  for(const lat of GRID_LATS){
    ctx.beginPath(); let first=true;
    for(let lon=-180;lon<=180;lon+=3){
      const {sx,sy,z}=project(rotate3D(latLonTo3D(lat,lon)));
      if(z<-0.05){first=true;continue;}
      first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
    }
    ctx.strokeStyle=lat===0?'rgba(0,200,255,0.22)':'rgba(0,200,255,0.07)'; ctx.stroke();
  }
  for(const lon of GRID_LONS){
    ctx.beginPath(); let first=true;
    for(let lat=-90;lat<=90;lat+=3){
      const {sx,sy,z}=project(rotate3D(latLonTo3D(lat,lon)));
      if(z<-0.05){first=true;continue;}
      first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
    }
    ctx.strokeStyle=lon===0?'rgba(0,200,255,0.18)':'rgba(0,200,255,0.06)'; ctx.stroke();
  }

  // Continents – filled polygons
  for(const poly of CONTINENTS){
    // Calculate visibility: draw only front-facing points
    ctx.beginPath();
    let penDown=false;
    for(const pt of poly){
      if(pt===null){penDown=false;continue;}
      const p3=rotate3D(latLonTo3D(pt[0],pt[1]));
      const {sx,sy,z}=project(p3);
      if(z<0.02){penDown=false;continue;}
      penDown?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);
      penDown=true;
    }
    ctx.closePath();
    ctx.fillStyle='rgba(30,100,60,0.55)';
    ctx.fill();
    ctx.strokeStyle='rgba(60,180,90,0.35)';
    ctx.lineWidth=0.8;
    ctx.stroke();
  }

  // Polar ice caps
  for(const poleLat of [75,-75]){
    ctx.beginPath(); let first=true;
    for(let lon=-180;lon<=180;lon+=5){
      const p3=rotate3D(latLonTo3D(poleLat,lon));
      const {sx,sy,z}=project(p3);
      if(z<0){first=true;continue;}
      first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy); first=false;
    }
    ctx.closePath();
    ctx.fillStyle='rgba(180,220,255,0.18)';
    ctx.fill();
  }

  // Specular highlight
  const spec=ctx.createRadialGradient(cx-r*0.35,cy-r*0.38,0, cx-r*0.2,cy-r*0.2,r*0.7);
  spec.addColorStop(0,'rgba(180,230,255,0.16)');
  spec.addColorStop(0.4,'rgba(100,180,255,0.05)');
  spec.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=spec; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // Outer rim glow
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  const rimGrad=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
  rimGrad.addColorStop(0,'rgba(0,160,255,0.5)');
  rimGrad.addColorStop(0.5,'rgba(0,220,255,0.2)');
  rimGrad.addColorStop(1,'rgba(0,120,200,0.5)');
  ctx.strokeStyle=rimGrad; ctx.lineWidth=2; ctx.stroke();
}

// ── Node drawing helpers ─────────────────────────────────────────────────
function drawShape(type, x, y, r, ctx){
  ctx.beginPath();
  switch(type){
    case 'diamond':
      ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.75, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r*0.75, y); ctx.closePath(); break;
    case 'hexagon':
      for(let i=0;i<6;i++){ const a=i*Math.PI/3-Math.PI/6; ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } ctx.closePath(); break;
    case 'triangle':
      ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.87, y+r*0.5); ctx.lineTo(x-r*0.87, y+r*0.5); ctx.closePath(); break;
    case 'square':
      ctx.rect(x-r*0.78,y-r*0.78,r*1.56,r*1.56); break;
    default:
      ctx.arc(x,y,r,0,Math.PI*2);
  }
}

function drawNodes(){
  const nodes2d=[];
  for(const atk of ATTACKS){
    const p3=rotate3D(latLonTo3D(atk.lat,atk.lon));
    const {sx,sy,z}=project(p3);
    const visible=z>-0.05;
    const alpha=visible?Math.max(0.15,(z+0.05)/1.05):0;
    nodes2d.push({atk,sx,sy,z,visible,alpha});
  }
  nodes2d.sort((a,b)=>a.z-b.z);

  // Team connection lines
  const teamMap={};
  for(const n of nodes2d){ const t=n.atk.team; if(!teamMap[t])teamMap[t]=[]; teamMap[t].push(n); }
  for(const [team,nodes] of Object.entries(teamMap)){
    const col=TEAMS[team].color;
    for(let i=0;i<nodes.length-1;i++){
      const a=nodes[i],b=nodes[i+1];
      if(!a.visible||!b.visible) continue;
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy);
      ctx.strokeStyle=col+'28'; ctx.lineWidth=1; ctx.setLineDash([4,7]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  for(const nd of nodes2d){
    if(!nd.visible||nd.alpha<0.05) continue;
    const {atk,sx,sy,alpha}=nd;
    const col=TEAMS[atk.team].color;
    const glow=TEAMS[atk.team].glow;
    const isHov=hoveredNode===atk.id;
    const baseR=isHov?20:14;
    const pulse=Math.sin(animFrame*0.05+atk.id*1.1)*2.5;
    const shape=SHAPES[atk.cat]||'diamond';

    ctx.globalAlpha=alpha;

    // Outer pulse ring
    const ringR=(baseR+pulse+14)*zoom;
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,ringR);
    g.addColorStop(0,glow); g.addColorStop(0.5,glow.replace('0.7','0.2')); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,ringR,0,Math.PI*2); ctx.fill();

    // Animated outer ring stroke
    ctx.save();
    ctx.strokeStyle=col+(isHov?'cc':'66');
    ctx.lineWidth=(isHov?2.5:1.5)*zoom;
    drawShape(shape,sx,sy,(baseR+6)*zoom,ctx);
    ctx.stroke(); ctx.restore();

    // Main node fill
    ctx.save();
    const fillGrad=ctx.createRadialGradient(sx-baseR*0.3*zoom,sy-baseR*0.3*zoom,0,sx,sy,baseR*zoom);
    fillGrad.addColorStop(0,isHov?'#ffffff':col+'ff');
    fillGrad.addColorStop(1,isHov?col+'bb':col+'99');
    ctx.fillStyle=fillGrad;
    drawShape(shape,sx,sy,baseR*zoom,ctx);
    ctx.fill();
    ctx.strokeStyle=isHov?'#fff':col+'aa';
    ctx.lineWidth=isHov?2.5:1.5;
    ctx.stroke(); ctx.restore();

    // Inner icon emoji
    ctx.save();
    ctx.font=`${Math.round((baseR*0.9)*zoom)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=alpha*(isHov?1:0.9);
    ctx.fillStyle=isHov?col:'#fff';
    ctx.fillText(getCatEmoji(atk.cat),sx,sy+1);
    ctx.restore();

    // Label
    if(alpha>0.35||isHov){
      ctx.save();
      ctx.font=`${isHov?'bold ':''} ${Math.round(11*zoom)}px 'Exo 2', sans-serif`;
      ctx.fillStyle=col;
      ctx.textAlign='center';
      ctx.shadowColor=col; ctx.shadowBlur=isHov?18:8;
      ctx.fillText(atk.name, sx, sy-(baseR+12)*zoom);
      ctx.shadowBlur=0;
      if(isHov){
        ctx.font=`${Math.round(9*zoom)}px 'Share Tech Mono', monospace`;
        ctx.fillStyle='rgba(200,232,255,0.65)';
        ctx.fillText('['+atk.team+']', sx, sy-(baseR+25)*zoom);
      }
      ctx.restore();
    }

    ctx.globalAlpha=1;
  }
}

function getCatEmoji(cat){
  const m={
    'Routing Attack':'⇄','Code Injection':'⌥','KI-gestützte Täuschung':'◈',
    'Spyware / Malware':'⚠','Social Engineering':'◉','Network Manipulation':'⬡',
    'VoIP Attack':'☎','WLAN Attack':'⌁','Kryptografischer Angriff':'⚿',
    'DoS/DDoS':'⚡','Web Attack':'⬡','Exploitation':'⚔','Privilege Escalation':'▲',
  };
  return m[cat]||'●';
}

function hitTest(mx,my){
  for(const atk of ATTACKS){
    const p3=rotate3D(latLonTo3D(atk.lat,atk.lon));
    const {sx,sy,z}=project(p3);
    if(z<0) continue;
    if(Math.hypot(mx-sx,my-sy)<24*zoom) return atk;
  }
  return null;
}

function openPanel(atk){
  const col=TEAMS[atk.team].color;
  document.getElementById('p-title').textContent=atk.name;
  document.getElementById('p-team').textContent=atk.team;
  document.getElementById('p-team').style.color=col;
  document.getElementById('p-team').style.borderColor=col;
  document.getElementById('p-layer').textContent=atk.layer;
  document.getElementById('p-cat').textContent=atk.cat;
  document.getElementById('p-sev').textContent=atk.sev;
  document.getElementById('p-proto').textContent=atk.proto;
  document.getElementById('p-desc').textContent=atk.desc;
  ['pf-layer','pf-cat','pf-sev','pf-proto'].forEach(id=>{ document.getElementById(id).style.borderLeftColor=col; });
  document.getElementById('detail-panel').classList.add('visible');
  autoRotate=false;
}
function closePanel(){ document.getElementById('detail-panel').classList.remove('visible'); hoveredNode=null; autoRotate=true; }

canvas.addEventListener('mousedown',e=>{ dragging=true; dragMoved=false; lastMX=e.clientX; lastMY=e.clientY; autoRotate=false; });
canvas.addEventListener('mousemove',e=>{
  if(dragging){
    const dx=e.clientX-lastMX, dy=e.clientY-lastMY;
    if(Math.hypot(dx,dy)>2) dragMoved=true;
    rotY+=dx*0.008; rotX+=dy*0.008;
    rotX=Math.max(-1.4,Math.min(1.4,rotX));
    lastMX=e.clientX; lastMY=e.clientY;
  } else {
    const hit=hitTest(e.clientX,e.clientY);
    hoveredNode=hit?hit.id:null;
    canvas.style.cursor=hit?'pointer':'grab';
  }
});
canvas.addEventListener('mouseup',e=>{
  if(!dragging) return;
  dragging=false;
  if(!dragMoved){
    const hit=hitTest(e.clientX,e.clientY);
    if(hit) openPanel(hit);
    else { closePanel(); autoRotate=true; }
  }
});
canvas.addEventListener('wheel',e=>{ zoom*=e.deltaY>0?0.92:1.09; zoom=Math.max(0.45,Math.min(2.8,zoom)); });
canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; dragging=true; dragMoved=false; lastMX=t.clientX; lastMY=t.clientY; autoRotate=false; });
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; rotY+=(t.clientX-lastMX)*0.01; rotX+=(t.clientY-lastMY)*0.01; rotX=Math.max(-1.4,Math.min(1.4,rotX)); lastMX=t.clientX; lastMY=t.clientY; dragMoved=true; },{passive:false});
canvas.addEventListener('touchend',()=>dragging=false);

function loop(){
  requestAnimationFrame(loop);
  animFrame++;
  if(autoRotate) rotY+=0.0025;
  ctx.clearRect(0,0,W,H);

  if(animFrame===1){
    window._stars=[];
    for(let i=0;i<220;i++) window._stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4,a:0.2+Math.random()*0.8,phase:Math.random()*Math.PI*2});
  }
  if(window._stars){
    for(const s of window._stars){
      ctx.globalAlpha=s.a*(0.35+0.25*Math.sin(animFrame*0.018+s.phase));
      ctx.fillStyle=`hsl(${200+Math.random()*60},80%,90%)`;
      ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  drawGlobe();
  drawNodes();
}
loop();
</script>
